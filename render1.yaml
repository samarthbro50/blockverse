services:
  - type: web
    name: blockverse
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blockverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: blockverse-db
    plan: free
    region: virginia
