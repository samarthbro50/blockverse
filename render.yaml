services:
  - type: web
    name: blockverse
    runtime: node
    plan: starter
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blockverse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: blockverse-db
    plan: basic-256mb
